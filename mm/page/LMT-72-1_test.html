<body>
    <!-- 웹 접근성 skip navigation -->
    <div class="skip-navigation">
        <a href="#content">본문 바로가기</a>

    <!-- wrap -->
    <div class="wrap">
        <!-- header -->
        <header class="header">
            <div class="con-inner">
                <h1 class="logo"><a><span class="blind">머니무브</span></a></h1>
            </div>

        <div id="content" role="main" class="bg-gray">
            <div class="con-inner">
                <div class="signup-form">
                    <div class="tit-area">
                        <p>금리·한도 조회</p>
                    </div>

                    <div class="alert help" role="alert">

                    <div class="form-list">

                        </div>

                        <div class="box-table">
                            <table>
                                <caption><span>금리·한도 조회 결과</span></caption>
                                <tbody>
                                    <tr>
                                        <th scope="row">최대 대출한도</th>
                                        <td>
                                            <strong class="unit-medium">1,000</strong>만원
                                        </td>
                                    </tr>
                                    <tr>
                                        <th scope="row">금리</th>
                                        <td>
                                            <strong class="unit-medium">6.07</strong>%
                                        </td>
                                    </tr>
                                    <tr>
                                        <th scope="row">상환방법</th>
                                        <td>
                                            <strong class="unit-medium">원리금균등상환</strong>

                                            <div class="tooltip">
                                                <button><span class="blind">툴팁</span></button>

                                            </div>
                                        </td>
                                    </tr>
                                    <tr>
                                        <th scope="row">월 평균 상환액</th>
                                        <td>
                                            <strong class="unit-medium">21,000</strong>원
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                        <p class="help-txt">본 대출조건은 고객님의 소득정보 및 재직정보에 따라 대출 심사 시 변경될 수 있으며, 심사진행에 어려운 내용이 확인되는 경우 심사가 거절될 수 있습니다. </p>

                        <div class="form-row mt-20">
                            <label class="labelBox unit">
                                <span class="label">신청 대출 금액</span>
                                <input type="number" inputmode="numeric" pattern="[0-9]*" title="금액 입력">
                            </label>
                        </div>

                        <div class="form-row">
                            <label class="labelBox">
                                <span class="label">상환방식</span>
                                <select class="form-control" dir="rtl" title="상환방식 선택">
                                    <option value="" disabled="" selected="" hidden="" data-default="">상환방식 선택</option>

                                    <option>만기일시상환</option>

                            </label>

                            <label class="labelBox">
                                <span class="label">상환기간</span>
