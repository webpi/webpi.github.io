	<!-- input pattern check -->
	<script>
		// 자리수
		var maxLength = document.querySelectorAll(".js-maxLength");
		maxLength.forEach(function(item) {
			// type이 text가 아닐대 maxlength 인식
			item.addEventListener("input", function() {
				if (this.value.length > this.maxLength){
					this.value = this.value.slice(0, this.maxLength);
				}
			},false);
		});

		// 숫자만
		var inputNumber = document.querySelectorAll(".js-onlyNumber");
		inputNumber.forEach(function(item) {
			item.addEventListener("input", function() {
				this.value = this.value.replace(/[^0-9]/g,'');
			},false);
		});

		// 영어만
		var inputEn = document.querySelectorAll(".js-onlyEn");
		inputEn.forEach(function(item) {
			item.addEventListener("input", function() {
				this.value=this.value.replace(/[^A-Za-z]/gi, '');
			},false);
		});

		// 한글만
		var inputKo = document.querySelectorAll(".js-onlyKo");
		inputKo.forEach(function(item) {
			item.addEventListener("input", function() {
				this.value=this.value.replace(/[^ㄱ-ㅎㅏ-ㅣ가-힣]/g, '');
			},false);
		});

		// 한글숫자공백
		var inputKoNumber = document.querySelectorAll(".js-onlyKoNumber");
		inputKoNumber.forEach(function(item) {
			item.addEventListener("input", function() {
				this.value=this.value.replace(/[^ㄱ-ㅎㅏ-ㅣ가-힣|0-9|\s]/g, '');
				this.value=this.value.replace(/^\s+|\s+$/gm,'');
			},false);
		});

		// 숫자 점
		var inputNumberDot = document.querySelectorAll(".js-onlyNumberDot");
		inputNumberDot.forEach(function(item) {
			item.addEventListener("input", function() {
				this.value=this.value.replace(/[^0-9.]/g, '');
			},false);
		});
